# docker/docker-compose.prod.yml — Production environment
# Usage: docker-compose -f docker/docker-compose.prod.yml up -d
version: "3.9"

x-common-env: &common-env
  DATABASE_URL:          postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
  REDIS_URL:             redis://redis:6379/0
  CELERY_BROKER_URL:     redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  ENVIRONMENT:           production
  DEBUG:                 "false"
  SECRET_KEY:            ${SECRET_KEY:?SECRET_KEY must be set}
  SENTRY_DSN:            ${SENTRY_DSN:-}

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB:       ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No port exposed — only reachable via PgBouncer inside Docker network
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── PgBouncer ──────────────────────────────────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:latest
    restart: always
    environment:
      POSTGRESQL_HOST:     db
      POSTGRESQL_PORT:     5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:?required}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:?required}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 500
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
    depends_on:
      db:
        condition: service_healthy

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?required}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  3s
      retries:  3

  # ── Nginx reverse proxy ────────────────────────────────────────────
  nginx:
    build:
      context:    ..
      dockerfile: docker/nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro       # mount your SSL certs here
      - ../uploads:/app/uploads:ro
    depends_on:
      - web

  # ── FastAPI — Gunicorn + Uvicorn workers ──────────────────────────
  web:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     production
    restart: always
    environment:
      <<: *common-env
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ../uploads:/app/uploads
    # No ports exposed — Nginx proxies to this container
    deploy:
      replicas: 2                       # scale horizontally
      resources:
        limits:
          memory: 1g
    command: >
      gunicorn app.main:app
      -c /app/docker/gunicorn.conf.py

  # ── Celery workers ─────────────────────────────────────────────────
  worker-tracking:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     production
    restart: always
    environment:
      <<: *common-env
    depends_on:
      - db
      - redis
    command: >
      celery -A app.core.celery_app worker
      --queues=tracking_queue
      --loglevel=warning
      --concurrency=4
      --hostname=worker-tracking@%h
    deploy:
      replicas: 1

  worker-pricing:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     production
    restart: always
    environment:
      <<: *common-env
    depends_on:
      - db
      - redis
    command: >
      celery -A app.core.celery_app worker
      --queues=pricing_queue,scraping_queue
      --loglevel=warning
      --concurrency=2
      --hostname=worker-pricing@%h

  worker-fx-notify:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     production
    restart: always
    environment:
      <<: *common-env
    depends_on:
      - db
      - redis
    command: >
      celery -A app.core.celery_app worker
      --queues=fx_queue,notification_queue
      --loglevel=warning
      --concurrency=2
      --hostname=worker-fx-notify@%h

  celery-beat:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     production
    restart: always
    environment:
      <<: *common-env
    depends_on:
      - redis
    volumes:
      - beat_data:/app/celerybeat
    command: >
      celery -A app.core.celery_app beat
      --loglevel=warning
      --schedule=/app/celerybeat/celerybeat-schedule

  # ── Flower — password protected ────────────────────────────────────
  flower:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     production
    restart: always
    environment:
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLOWER_BASIC_AUTH:     ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?required}
    depends_on:
      - redis
    # Internal only — expose via Nginx with IP restriction in production
    command: >
      celery -A app.core.celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD}

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         https://${DOMAIN}/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  beat_data:
  prometheus_data:
  grafana_data: