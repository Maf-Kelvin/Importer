# docker/docker-compose.prod.yml
# Production environment
# Secrets and application configuration are supplied through ../.env.
# Never commit .env to version control.

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-import_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-import_logistics}
  BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS must be set}'
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/1
  CACHE_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis-cache:6379/0
  ENVIRONMENT: production
  DEBUG: "false"
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}

# Application services connect through PgBouncer.
# Migrations use the direct PostgreSQL connection above.
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-import_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@pgbouncer:5432/${POSTGRES_DB:-import_logistics}
  DATABASE_PGBOUNCER: "true"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-import_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-import_logistics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── PgBouncer ───────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-import_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_NAME: ${POSTGRES_DB:-import_logistics}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${DB_USER}\" -d \"$${DB_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — durable application state ───────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Redis — disposable cache ────────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Database migrations ─────────────────────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    restart: "no"
    env_file:
      - ../.env
    environment:
      <<: *common-env
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_PGBOUNCER: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # ── FastAPI application ─────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: [*app-env, *common-env]
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery worker — tracking ────────────────────────────────────────
  worker-tracking:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: [*app-env, *common-env]
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - --queues=tracking_queue
      - --loglevel=info
      - --concurrency=2
      - --hostname=worker-tracking@%h
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping", "-d", "worker-tracking@%h"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery worker — pricing and scraping ────────────────────────────
  worker-pricing:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: [*app-env, *common-env]
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - --queues=pricing_queue,scraping_queue
      - --loglevel=info
      - --concurrency=2
      - --hostname=worker-pricing@%h

  # ── Celery worker — FX and notifications ────────────────────────────
  worker-fx-notify:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: [*app-env, *common-env]
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - --queues=fx_queue,notification_queue,default
      - --loglevel=info
      - --concurrency=2
      - --hostname=worker-fx-notify@%h

  # ── Celery Beat scheduler ───────────────────────────────────────────
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: [*app-env, *common-env]
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - beat_data:/app/celerybeat
    command:
      - celery
      - -A
      - app.core.celery_app
      - beat
      - --loglevel=info
      - --schedule=/app/celerybeat/celerybeat-schedule

  # ── Flower — Celery monitoring ──────────────────────────────────────
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/1
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.core.celery_app
      - flower
      - --port=5555
      - "--basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}"

  # ── Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  # ── Grafana ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  beat_data:
  uploads_data:
  prometheus_data:
  grafana_data: