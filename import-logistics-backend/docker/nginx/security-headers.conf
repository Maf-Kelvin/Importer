# Included by nginx.conf. nginx does NOT inherit add_header into a location that sets its own add_header,
# so this file is included at server level AND again in every location that adds headers.
add_header X-Frame-Options           "DENY"                                   always;
add_header X-Content-Type-Options    "nosniff"                                always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"        always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"    always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
# Scripts only from our own origin (no inline scripts). Styles allow inline because Radix and the charts set
# style attributes/tags at runtime; that is a deliberate, low-risk concession (script-src stays strict).
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
