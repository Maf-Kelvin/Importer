# docker/nginx/nginx.conf
user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ──────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain application/json application/javascript text/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # ── Rate limiting zones ───────────────────────────────────────────
    # Per IP. This is the only rate limiting in the stack (the app has none), so keep it in front of the API
    # Answer rate-limited requests with 429 (nginx's default is 503, which clients read as an outage)
    limit_req_status 429;

    limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m      rate=300r/m;   # a single-page app makes several calls per screen
    limit_req_zone $binary_remote_addr zone=tracking_zone:10m rate=20r/m;

    # ── Upstream ──────────────────────────────────────────────────────
    upstream fastapi {
        least_conn;
        server web:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ─────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # ── SSL ───────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ─────────────────────────────────────────
        # Security headers live in one shared snippet (see security-headers.conf)
        include /etc/nginx/snippets/security-headers.conf;

        # ── Request size limit ───────────────────────────────────────
        client_max_body_size 15m;

        # ── Auth endpoints — strict rate limiting ─────────────────────
        location /api/v1/auth/login {
            limit_req zone=login_zone burst=3 nodelay;
            proxy_pass         http://fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Tracking endpoints — moderate rate limiting ───────────────
        location ~ ^/api/v1/tracking {
            limit_req zone=tracking_zone burst=5 nodelay;
            proxy_pass         http://fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── All other API endpoints ───────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass           http://fastapi;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_read_timeout   60s;
            proxy_connect_timeout 10s;
        }

        # ── Health endpoints — no rate limit ─────────────────────────
        location ~ ^/(health|ready)$ {
            proxy_pass http://fastapi;
        }

        # Prometheus scrapes the API inside the Docker network; never expose metrics publicly
        location = /metrics {
            return 404;
        }

        # Uploaded files are NOT served statically: they are downloaded through the
        # authenticated endpoint GET /api/v1/files/{key} (tenant-checked).

        # -- The web app (built into /usr/share/nginx/html by the Dockerfile) -----------------
        root /usr/share/nginx/html;

        # Hashed build output never changes under the same name: cache it for a year.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Everything else is the single-page app: unknown paths fall back to index.html so deep links and
        # refreshes work. index.html must be revalidated every time so a new release is picked up.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }
}