# docker/nginx/nginx.conf
user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ──────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # ── Rate limiting zones ───────────────────────────────────────────
    # Per IP — complements SlowAPI per-user limiting in the app
    limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m      rate=100r/m;
    limit_req_zone $binary_remote_addr zone=tracking_zone:10m rate=20r/m;

    # ── Upstream ──────────────────────────────────────────────────────
    upstream fastapi {
        least_conn;
        server web:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ─────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # ── SSL ───────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ─────────────────────────────────────────
        add_header X-Frame-Options           DENY            always;
        add_header X-Content-Type-Options    nosniff         always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── Request size limit ───────────────────────────────────────
        client_max_body_size 15m;

        # ── Auth endpoints — strict rate limiting ─────────────────────
        location /api/v1/auth/login {
            limit_req zone=login_zone burst=3 nodelay;
            proxy_pass         http://fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Tracking endpoints — moderate rate limiting ───────────────
        location ~ ^/api/v1/tracking {
            limit_req zone=tracking_zone burst=5 nodelay;
            proxy_pass         http://fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── All other API endpoints ───────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass           http://fastapi;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_read_timeout   60s;
            proxy_connect_timeout 10s;
        }

        # ── Health endpoints — no rate limit ─────────────────────────
        location ~ ^/(health|ready|metrics) {
            proxy_pass http://fastapi;
        }

        # ── Static uploads ────────────────────────────────────────────
        location /uploads/ {
            alias      /app/uploads/;
            expires    30d;
            add_header Cache-Control "public, immutable";
        }
    }
}