# docker/docker-compose.yml — Development environment
# Passwords are set via .env file — never hardcode in production
version: "3.9"

x-common-env: &common-env
  DATABASE_URL:          postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL:             redis://redis:6379/0
  CELERY_BROKER_URL:     redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  ENVIRONMENT:           development
  DEBUG:                 "true"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-import_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB:       ${POSTGRES_DB:-import_logistics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-import_user}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── PgBouncer — connection pooler ──────────────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:latest
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST:     db
      POSTGRESQL_PORT:     5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-import_user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-import_logistics}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  3s
      retries:  3

  # ── FastAPI application ────────────────────────────────────────────
  web:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     development
    restart: unless-stopped
    environment:
      <<: *common-env
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../app:/app/app
      - ../uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery workers — one per queue ────────────────────────────────
  worker-tracking:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     development
    restart: unless-stopped
    environment:
      <<: *common-env
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      - db
      - redis
    volumes:
      - ../app:/app/app
    command: >
      celery -A app.core.celery_app worker
      --queues=tracking_queue
      --loglevel=info
      --concurrency=2
      --hostname=worker-tracking@%h
    healthcheck:
      test:     ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping", "-d", "worker-tracking@%h"]
      interval: 30s
      timeout:  10s
      retries:  3

  worker-pricing:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     development
    restart: unless-stopped
    environment:
      <<: *common-env
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      - db
      - redis
    volumes:
      - ../app:/app/app
    command: >
      celery -A app.core.celery_app worker
      --queues=pricing_queue,scraping_queue
      --loglevel=info
      --concurrency=2
      --hostname=worker-pricing@%h

  worker-fx-notify:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     development
    restart: unless-stopped
    environment:
      <<: *common-env
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      - db
      - redis
    volumes:
      - ../app:/app/app
    command: >
      celery -A app.core.celery_app worker
      --queues=fx_queue,notification_queue
      --loglevel=info
      --concurrency=2
      --hostname=worker-fx-notify@%h

  # ── Celery Beat scheduler ──────────────────────────────────────────
  celery-beat:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     development
    restart: unless-stopped
    environment:
      <<: *common-env
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      - redis
    volumes:
      - ../app:/app/app
      - beat_data:/app/celerybeat
    command: >
      celery -A app.core.celery_app beat
      --loglevel=info
      --schedule=/app/celerybeat/celerybeat-schedule

  # ── Flower — Celery monitoring UI ─────────────────────────────────
  flower:
    build:
      context:    ..
      dockerfile: docker/Dockerfile
      target:     development
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL:     redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLOWER_BASIC_AUTH:     ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: >
      celery -A app.core.celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD}

  # ── Prometheus ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  # ── Grafana ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  beat_data:
  prometheus_data:
  grafana_data: