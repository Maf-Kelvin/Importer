name: importer_mobile
description: Importer - container, item and profit tracking for importers (iOS and Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_native_contact_picker: ^0.0.13
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path_provider: ^2.1.4
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
